{% extends 'base.html' %}
{% block title %}{% if object %}Редактировать курс{% else %}Создать курс{% endif %}{% endblock %}
{% block content %}
<h1>{% if object %}Редактировать курс{% else %}Создать курс{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'course_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
