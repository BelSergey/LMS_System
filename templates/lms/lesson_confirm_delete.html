{% extends 'base.html' %}
{% block title %}Удаление урока{% endblock %}
{% block content %}
<h1>Удалить урок "{{ object.title }}"?</h1>
<p>Вы уверены?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'lms:lesson_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
