{% extends 'base.html' %}
{% block title %}Уроки{% endblock %}
{% block content %}
<h1>Уроки</h1>
{% if user.is_staff %}
    <a href="{% url 'lms:lesson_create' %}" class="btn btn-primary mb-3">Добавить урок</a>
{% endif %}
<ul>
    {% for lesson in lessons %}
        <li><a href="{% url 'lms:lesson_detail' lesson.pk %}">{{ lesson.title }}</a> ({{ lesson.course.title }})</li>
    {% empty %}
        <li>Уроков пока нет.</li>
    {% endfor %}
</ul>
{% endblock %}
